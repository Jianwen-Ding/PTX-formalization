name: CI

on:
  push:
  pull_request:

# The Sail models (sail/agx, sail/ptx) are the maintained ones; the K semantics is obsolete and not built here.
jobs:
  sail:
    runs-on: ubuntu-24.04
    env:
      SAIL_VERSION: 0.20.3
      JOBS: 4
    steps:
      - uses: actions/checkout@v4

      - name: System packages (z3 for Sail's type checker, gmp / zlib for the C backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y z3 libgmp-dev zlib1g-dev pkg-config

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.1

      - name: Install Sail
        run: |
          opam install -y sail.${SAIL_VERSION}
          opam exec -- sail --version

      - name: Build the Sail models
        run: opam exec -- make -C sail all

      - name: AGX tests and PTX tests (tests/*.ptx against tests/*.out)
        run: opam exec -- make -C sail test JOBS=$JOBS

      - name: PTX negative tests and ZLUDA programs (tests/neg, tests/zluda)
        run: opam exec -- make -C sail test-ptx-extra JOBS=$JOBS
